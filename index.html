<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tailwind CSS & DaisyUI</title>

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- DaisyUI -->
  <link href="https://cdn.jsdelivr.net/npm/daisyui@5" rel="stylesheet" type="text/css" />

  <style>
    html, body {
      height: 100%;
      margin: 0;
    }
  </style>
</head>

<body class="m-8">
  <header>

  </header>
  <main>
     <div class="flex flex-col md:flex-row">
      <!-- shape card container -->
    <div class="flex-1 grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3">
      <!-- tringle -->
 <div class="card bg-base-100 w-96 shadow-sm">
  <figure>
    <img
      src="/images/triangle.png"
      alt="Shoes" />
  </figure>
  <div class="card-body ">
    <h2 class="card-title text-center">Triangle</h2>
    <p class="text-center">Area(A) = 0.5 X b X h</p>
    <div class="flex">
      <input id="triangle-base" class="w-24 text-2xl p-2 rounded-sm" type="text" placeholder="base">
    <span>cm</span>
    <input id="tringle-height" class="w-24 text-2xl p-2 rounded-sm" type="text" placeholder="height">
    <span>cm</span>
    </div>
    <div>
      <p class="text-2xl">Area: <span id="triangle-area">0</span> <span>cm<sup>2</sup></span></p>
    </div>
    <div class="card-actions justify-end">
      <button onclick="calculateTringleArea()" class="btn btn-primary w-full">Calculate</button>
    </div>
  </div>
</div>
 <!--Rectangle  -->
<div class="card bg-base-100 w-96 shadow-sm">
  <figure>
    <img
      src="/images/rectangle.png"
      alt="Shoes" />
  </figure>
  <div class="card-body">
    <h2 class="card-title">Rectangle</h2>
    <p>Area (A) = w X I</p>
    <div class="flex">
         <input id="rectangle-width" type="text" class="w-24 text-2xl rounded-sm p-2" placeholder="width"><span>cm</span>
    <input id="rectangle-length" type="text" class="w-24 text-2xl rounded-sm p-2" placeholder="length"><span>cm</span>
    </div>
    <div>
      <p class="text-2xl">Area: <span id="rectangle-area">0</span> <span>cm<sup>2</sup></span></p>
    </div>
    <div class="card-actions justify-end">
      <button onclick="calculateRectangleArea()" class="btn btn-primary w-full">Calculate</button>
    </div>
  </div>
</div>
<!--Parallelogram  -->
 <div class="card bg-base-100 w-96 shadow-sm">
  <figure>
    <img
      src="/images/parallelogram.png"
      alt="Shoes" />
  </figure>
  <div class="card-body">
    <h2 class="card-title">parallelogram</h2>
    <p>Area (A) = b * h</p>
    <div class="card-actions justify-end">
      <div class="flex">
        <input type="text" id="parallelogram-base" class="text-2xl rounded-sm p-2 w-24" placeholder="base"><span>cm</span>
            <input type="text" id="parallelogram-height" class="text-2xl rounded-sm p-2 w-24" placeholder="height"><span>cm</span>
      </div>
      <button class="btn btn-primary w-full">Calculate</button>
    </div>
  </div>
</div>
      <!-- Rhombus -->
 <div class="card bg-base-100 w-96 shadow-sm">

      <button onclick="calculateTringleArea()" class="btn btn-primary w-full">Calculate</button>

  </div>
</div>

    <span>cm</span>
    </div>
    <div class="card-actions justify-end">
      <button onclick="calculateTringleArea()" class="btn btn-primary w-full">Calculate</button>
    </div>
  </div>
</div>

 <div class="card bg-base-100 w-96 shadow-sm">

    <div class="card-actions justify-end">

</div>

<!-- area calculation part -->
